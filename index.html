<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Simulado AWS Cloud Protitioner - Daniel Eufrasio</title>

  <!-- Meta para responsividade no mobile -->
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  <style>
    /* Faz o body ocupar a altura toda e permite scroll interno */
    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      flex-direction: column;
      background-color: #f8f9fa;
    }

    /* Conteúdo principal ocupa o espaço restante abaixo da navbar */
    main {
      flex: 1 0 auto;
      display: flex;
      flex-direction: column;
    }

    /* Container do quiz ocupa quase a largura toda no mobile */
    #quiz-container {
      padding-bottom: 1.5rem;
    }

    @media (max-width: 576px) {
      #quiz-container .col-lg-8 {
        padding-left: 0;
        padding-right: 0;
      }
      .card {
        border-radius: 0;
      }
      body {
        background-color: #fff;
      }
    }
  </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark mb-3">
  <div class="container-fluid">
    <span class="navbar-brand mb-0 h1">Simulado AWS Cloud</span>
    <span class="navbar-text text-light">
      Tempo: <strong id="timer">90:00</strong>
    </span>
  </div>
</nav>

<main>
  <div class="container-fluid" id="quiz-container">
    <!-- JS injeta a questão atual ou o resultado -->
  </div>
</main>
<footer class="footer mt-auto py-3 bg-dark text-light">
  <div class="container-fluid d-flex justify-content-between align-items-center">
    <span class="text-white-50">
      Desenvolvido por Daniel Eufrasio
    </span>

    <div>
      <a href="https://www.linkedin.com/in/danieleufrasio/" target="_blank" class="text-light me-3 footer-link">
        <i class="bi bi-linkedin me-1"></i> LinkedIn
      </a>
      <a href="https://www.instagram.com/eufrasio_cyborg/" target="_blank" class="text-light footer-link">
        <i class="bi bi-instagram me-1"></i> Instagram
      </a>
    </div>
  </div>
</footer>
<script src="questions.js"></script>
<script src="script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
