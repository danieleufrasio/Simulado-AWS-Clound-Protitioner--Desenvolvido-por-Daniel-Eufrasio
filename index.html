<!doctype html>
<html lang="pt-BR">
<head>
  <meta charset="utf-8">
  <title>Simulado AWS Cloud (Front-end)</title>

  <!-- Meta para responsividade no mobile -->
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

  <style>
    /* Faz o body ocupar a altura toda e permite scroll interno */
    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      display: flex;
      flex-direction: column;
      background-color: #f8f9fa;
    }

    /* Conteúdo principal ocupa o espaço restante abaixo da navbar */
    main {
      flex: 1 0 auto;
      display: flex;
      flex-direction: column;
    }

    /* Container do quiz ocupa quase a largura toda no mobile */
    #quiz-container {
      padding-bottom: 1.5rem;
    }

    @media (max-width: 576px) {
      #quiz-container .col-lg-8 {
        padding-left: 0;
        padding-right: 0;
      }
      .card {
        border-radius: 0;
      }
      body {
        background-color: #fff;
      }
    }
  </style>
</head>
<body>

<nav class="navbar navbar-dark bg-dark mb-3">
  <div class="container-fluid">
    <span class="navbar-brand mb-0 h1">Simulado AWS Cloud</span>
    <span class="navbar-text text-light">
      Tempo: <strong id="timer">90:00</strong>
    </span>
  </div>
</nav>

<main>
  <div class="container-fluid" id="quiz-container">
    <!-- JS injeta a questão atual ou o resultado -->
  </div>
</main>

<script src="questions.js"></script>
<script src="script.js"></script>
<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
</body>
</html>
